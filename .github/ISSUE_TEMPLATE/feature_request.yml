name: Feature or idea
description: Suggest something the workbench could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation in the game first; the best feature often looks different from the first idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
