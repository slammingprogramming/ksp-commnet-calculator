name: Deploy to GitHub Pages

# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs on purpose: deploy-pages looks the artifact up through the API, which can lag for a moment
  # behind the upload. In one job the lookup came less than a second after the upload and found nothing (the 1.7.0 deploy failed
  # four times that way); a second job starts seconds later.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
      - name: Assemble site
        run: |
          mkdir dist
          cp -r index.html css js sw.js manifest.webmanifest icon.svg LICENSE dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
