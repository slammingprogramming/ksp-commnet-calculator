name: Check mod antenna data

# The bundled antenna values for ReStock+, Near Future Exploration, DMagic, JX2Antenna and ProbesPlus come from those
# mods' part configs. Once a month, compare them with the mods' current repositories; a red run means the data needs
# a look (the log lists every part that changed, appeared or vanished).
on:
  schedule:
    - cron: '17 5 3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/check-mod-data.js

  # The importer and the planner against a real planet pack (JNSQ, which rescales the whole system): see scripts/check-planet-pack.js
  planet-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/check-planet-pack.js
