name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard - no private or agent files in the repository
        run: |
          bad=$(git ls-files | grep -E '(^|/)(AGENTS\.md|CLAUDE\.md|MEMORY\.md|\.claude/|.*\.gsheet$|.*\.gform$)' || true)
          if [ -n "$bad" ]; then echo "Private files are tracked:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
